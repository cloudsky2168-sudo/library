<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용 안내 - 꿈꾸는 도서관</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>ℹ️ 이용 안내</h1>
    </header>
    <main>
        <div class="page-container">
            <a href="index.html" class="back-btn">⬅ 홈으로 돌아가기</a>
            <div class="page-content">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                    <div>
                        <h3
                            style="color: var(--primary-color); margin-bottom: 1rem; border-bottom: 2px solid #e0e7ff; padding-bottom: 0.5rem;">
                            ⏰ 운영 시간</h3>
                        <table style="width: 100%; border-collapse: collapse;">
                            <tr style="background: #f8fafc;">
                                <td style="padding: 0.8rem; border: 1px solid #e2e8f0;">평일 (월~금)</td>
                                <td style="padding: 0.8rem; border: 1px solid #e2e8f0; font-weight: bold;">09:00 ~ 16:30
                                </td>
                            </tr>
                            <tr>
                                <td style="padding: 0.8rem; border: 1px solid #e2e8f0;">점심 시간</td>
                                <td style="padding: 0.8rem; border: 1px solid #e2e8f0; font-weight: bold;">12:00 ~ 13:00
                                </td>
                            </tr>
                            <tr style="background: #f8fafc;">
                                <td style="padding: 0.8rem; border: 1px solid #e2e8f0;">주말 및 공휴일</td>
                                <td
                                    style="padding: 0.8rem; border: 1px solid #e2e8f0; color: #ef4444; font-weight: bold;">
                                    휴관</td>
                            </tr>
                        </table>
                    </div>
                    <div>
                        <h3
                            style="color: var(--primary-color); margin-bottom: 1rem; border-bottom: 2px solid #e0e7ff; padding-bottom: 0.5rem;">
                            📜 도서관 규칙</h3>
                        <ul style="padding-left: 1.5rem; line-height: 2;">
                            <li>도서관에서는 <strong>조용히</strong> 걸어 다녀요.</li>
                            <li>책을 소중히 다루고 낙서하지 않아요.</li>
                            <li>다 읽은 책은 <strong>북트럭</strong>에 놓아주세요.</li>
                            <li>친구들과 떠들거나 장난치지 않아요.</li>
                            <li>음식물은 가지고 들어올 수 없어요.</li>
                        </ul>
                    </div>
                </div>

                <div
                    style="margin-top: 2rem; background: #fff7ed; padding: 1.5rem; border-radius: 10px; border: 1px solid #ffedd5; text-align: center;">
                    <h3 style="color: #ea580c; margin-bottom: 0.5rem;">📞 문의 전화</h3>
                    <p style="font-size: 1.2rem; font-weight: bold;">02-1234-5678 (도서관실)</p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 꿈꾸는 초등학교 도서관</p>
    </footer>
</body>

</html>
