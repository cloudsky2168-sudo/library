<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 검색 - 꿈꾸는 도서관</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>🔍 도서 검색</h1>
    </header>
    <main>
        <div class="page-container">
            <a href="index.html" class="back-btn">⬅ 홈으로 돌아가기</a>
            <div class="page-content" style="text-align: center;">
                <h2 style="margin-bottom: 2rem; color: var(--primary-color);">찾고 싶은 책의 제목을 입력하세요!</h2>
                <div
                    style="background: #f1f5f9; padding: 2rem; border-radius: 1rem; display: inline-block; width: 100%; max-width: 600px;">
                    <input type="text" placeholder="예: 해리포터, 마법천자문..."
                        style="width: 70%; padding: 1rem; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 1.1rem; outline: none;">
                    <button
                        style="width: 25%; padding: 1rem; background: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer; margin-left: 2%;">검색</button>
                    <div style="margin-top: 2rem; text-align: left;">
                        <span
                            style="background: #e0e7ff; color: #4338ca; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.9rem; margin-right: 0.5rem;">#인기검색어</span>
                        <span style="color: #64748b;">과학, 역사, 모험, 동화</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 꿈꾸는 초등학교 도서관</p>
    </footer>
</body>

</html>
