<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추천 도서 - 꿈꾸는 도서관</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>👍 사서쌤 추천</h1>
    </header>
    <main>
        <div class="page-container">
            <a href="index.html" class="back-btn">⬅ 홈으로 돌아가기</a>
            <div class="page-content">
                <div
                    style="background: linear-gradient(to right, #818cf8, #c084fc); color: white; padding: 2rem; border-radius: 15px; margin-bottom: 2rem;">
                    <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">🎓 이달의 추천 테마: "모험"</h2>
                    <p style="opacity: 0.9;">두근두근! 미지의 세계로 떠나는 모험 이야기를 만나보세요.</p>
                </div>

                <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                    <div
                        style="flex: 1; min-width: 300px; background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                        <div
                            style="height: 200px; background: #e2e8f0; display: flex; align-items: center; justify-content: center;">
                            책 이미지</div>
                        <div style="padding: 1.5rem;">
                            <h3 style="color: #333; margin-bottom: 0.5rem;">보물섬을 찾아서</h3>
                            <p style="color: #666; font-size: 0.95rem; margin-bottom: 1rem;">친구들과 함께 떠나는 신나는 보물찾기 여행!
                            </p>
                            <button
                                style="background: #4f46e5; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer;">자세히
                                보기</button>
                        </div>
                    </div>

                    <div
                        style="flex: 1; min-width: 300px; background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                        <div
                            style="height: 200px; background: #e2e8f0; display: flex; align-items: center; justify-content: center;">
                            책 이미지</div>
                        <div style="padding: 1.5rem;">
                            <h3 style="color: #333; margin-bottom: 0.5rem;">정글의 법칙</h3>
                            <p style="color: #666; font-size: 0.95rem; margin-bottom: 1rem;">야생에서 살아남는 동물들의 지혜를 배워봐요.
                            </p>
                            <button
                                style="background: #4f46e5; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer;">자세히
                                보기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 꿈꾸는 초등학교 도서관</p>
    </footer>
</body>

</html>
